<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administrador — TeVende</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap');
  :root { --navy: #102738; --coral: #E64F3F; --mint: #C1E1D6; --gray: #E3E4E3; --white: #FFFFFF; --muted: #5C6B76; }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito Sans', -apple-system, sans-serif; background: var(--gray); color: var(--navy); margin: 0; padding: 20px; }
  #login { max-width: 340px; margin: 80px auto; background: var(--white); border-radius: 16px; padding: 28px; text-align: center; }
  #login input { width: 100%; font-size: 14px; border: 1.5px solid var(--gray); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #login button, .small-btn { background: var(--coral); color: #fff; border: none; border-radius: 999px; padding: 10px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 18px; margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--gray); }
  th { background: var(--navy); color: #fff; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  a { color: var(--coral); font-weight: 700; text-decoration: none; }
  .status { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .st-authorized { background: #DCEFE4; color: #1E7B34; }
  .st-inactive, .st-cancelled { background: #E3E4E3; color: #8A8A8A; }
  .st-pending, .st-paused { background: #FFF3D6; color: #8A6D00; }
  input[type=date] { font-size: 12.5px; border: 1.5px solid var(--gray); border-radius: 6px; padding: 4px 6px; }
  select.invoice-select { font-size: 12px; font-weight: 700; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  select.invoice-pendiente { background: #FBE2DE; color: #B03A2A; }
  select.invoice-emitida { background: #DCEFE4; color: #1E7B34; }
  #error { color: var(--coral); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div id="login">
  <h1>Panel de administrador</h1>
  <input id="adminKey" type="password" placeholder="Clave de administrador" />
  <button onclick="login()">Entrar</button>
  <div id="error"></div>
</div>

<div id="app" style="display:none; max-width:900px; margin:0 auto;">
  <h1>Todos los negocios</h1>
  <table>
    <thead>
      <tr><th>Negocio</th><th>Links</th><th>Suscripción</th><th>Último pago</th><th>Boleta/Factura</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
  const BACKEND_URL = "https://pont-backend-production.up.railway.app";
  const SITE_URL = window.location.origin;

  function getKey() { return sessionStorage.getItem("admin_key"); }

  function login() {
    const key = document.getElementById("adminKey").value.trim();
    if (!key) return;
    sessionStorage.setItem("admin_key", key);
    loadAll();
  }

  function authHeaders() { return { "Content-Type": "application/json", "x-admin-key": getKey() || "" }; }

  const STATUS_LABEL = { authorized: "Al día", pending: "Pendiente", paused: "Pausada", cancelled: "Cancelada", inactive: "Sin suscribirse" };

  async function loadAll() {
    const res = await fetch(`${BACKEND_URL}/api/admin/businesses`, { headers: authHeaders() });
    if (!res.ok) {
      document.getElementById("error").textContent = "Clave incorrecta.";
      return;
    }
    const data = await res.json();
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("rows").innerHTML = data.businesses.map((b) => {
      const chatUrl = `${SITE_URL}/?negocio=${b.slug}`;
      const ventasUrl = `${SITE_URL}/ventas.html?negocio=${b.slug}&admin_key=${encodeURIComponent(getKey() || "")}`;
      const status = b.subscription_status || "inactive";
      const dateVal = b.last_payment_date ? new Date(b.last_payment_date).toISOString().slice(0, 10) : "";
      const invoiceStatus = b.invoice_status === "emitida" ? "emitida" : "pendiente";
      return `
        <tr>
          <td><b>${b.name}</b><br/><span style="color:var(--muted); font-size:11.5px;">${b.slug}</span></td>
          <td>
            <a href="${chatUrl}" target="_blank">Chat</a> ·
            <a href="${ventasUrl}" target="_blank">Panel</a>
          </td>
          <td><span class="status st-${status}">${STATUS_LABEL[status] || status}</span></td>
          <td><input type="date" value="${dateVal}" onchange="updatePaymentDate('${b.slug}', this.value)" /></td>
          <td>
            <select class="invoice-select invoice-${invoiceStatus}" onchange="updateInvoiceStatus('${b.slug}', this.value, this)">
              <option value="pendiente" ${invoiceStatus === "pendiente" ? "selected" : ""}>Boleta/Factura pendiente</option>
              <option value="emitida" ${invoiceStatus === "emitida" ? "selected" : ""}>Boleta/Factura emitida</option>
            </select>
          </td>
        </tr>`;
    }).join("");
  }

  async function updatePaymentDate(slug, value) {
    await fetch(`${BACKEND_URL}/api/admin/businesses/${slug}/last-payment`, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify({ last_payment_date: value ? new Date(value).toISOString() : null }),
    });
  }

  async function updateInvoiceStatus(slug, value, selectEl) {
    await fetch(`${BACKEND_URL}/api/admin/businesses/${slug}/invoice-status`, {
      method: "PUT",
      headers: authHeaders(),
      body: JSON.stringify({ invoice_status: value }),
    });
    selectEl.className = `invoice-select invoice-${value}`;
  }

  if (getKey()) loadAll();
</script>
</body>
</html>
