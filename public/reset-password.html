<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elegir clave nueva — TeVende</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap');
  :root { --navy: #102738; --coral: #E64F3F; --mint: #C1E1D6; --gray: #E3E4E3; --white: #FFFFFF; --muted: #5C6B76; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Nunito Sans', -apple-system, sans-serif; background: var(--gray); color: var(--navy);
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #card { background: var(--white); border-radius: 16px; padding: 32px; max-width: 380px; width: 100%; box-shadow: 0 2px 8px rgba(16,39,56,0.08); text-align: center; }
  .tagline { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 20px; margin-bottom: 22px; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  label { display: block; text-align: left; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 14px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; font-family: 'Nunito Sans', sans-serif; font-size: 14px; color: var(--navy);
    border: 1.5px solid var(--gray); border-radius: 8px; padding: 10px 12px;
  }
  button {
    width: 100%; margin-top: 20px; background: var(--coral); color: #fff; border: none; border-radius: 999px;
    padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'Nunito Sans', sans-serif;
  }
  button:disabled { opacity: .5; cursor: default; }
  #error { color: var(--coral); font-size: 13px; margin-top: 10px; }
  #okScreen { display: none; }
  #okScreen a { color: var(--coral); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div id="card">
  <div class="tagline">TeVende</div>

  <div id="form">
    <h1>Elige una clave nueva</h1>
    <p class="sub">Esta va a ser tu nueva clave para entrar al panel de tu negocio.</p>

    <label>Clave nueva</label>
    <input id="newPassword" type="password" placeholder="Mínimo 4 caracteres" />

    <button id="submitBtn" onclick="submitReset()">Guardar clave nueva</button>
    <div id="error"></div>
  </div>

  <div id="okScreen">
    <h1>¡Listo!</h1>
    <p class="sub">Tu clave se actualizó. Ya puedes entrar a tu panel con la clave nueva.</p>
    <a id="goToPanel" href="#">Ir a mi panel →</a>
  </div>
</div>

<script>
  const BACKEND_URL = "https://pont-backend-production.up.railway.app";
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const negocio = params.get("negocio") || "";

  if (!token) {
    document.getElementById("form").style.display = "none";
    document.getElementById("error").textContent = "Falta el link completo. Pide uno nuevo desde tu panel.";
  }

  async function submitReset() {
    const password = document.getElementById("newPassword").value;
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    if (!password || password.length < 4) {
      errorEl.textContent = "La clave debe tener al menos 4 caracteres.";
      return;
    }
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    try {
      const res = await fetch(`${BACKEND_URL}/api/business/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || "El link ya no es válido. Pide uno nuevo.";
        btn.disabled = false;
        return;
      }
      document.getElementById("form").style.display = "none";
      document.getElementById("okScreen").style.display = "block";
      document.getElementById("goToPanel").href = `/ventas.html?negocio=${data.slug || negocio}`;
    } catch (e) {
      errorEl.textContent = "No pudimos conectarnos. Intenta de nuevo.";
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
